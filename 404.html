<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>后台管理系统</title>
  <script>
    var path = window.location.pathname;
    var base = '/admin-demo/';
    if (path.startsWith(base)) {
      var route = path.substring(base.length);
      window.location.href = base + '#' + (route ? '/' + route : '/');
    } else {
      window.location.href = base + '#/';
    }
  </script>
</head>
<body>
  <p>正在跳转...</p>
</body>
</html>
